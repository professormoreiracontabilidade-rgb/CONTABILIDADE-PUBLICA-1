<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dff3ff">
<title>Questões | Professor Moreira</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#dff3ff;font-family:Arial,Helvetica,sans-serif}
  body{min-height:100dvh;display:flex;justify-content:center;color:#07345b}
  .app{width:min(100%,720px);min-height:100dvh;display:flex;flex-direction:column;padding:10px 10px max(10px,env(safe-area-inset-bottom))}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 3px 9px}
  .titulo{font-size:clamp(15px,4vw,19px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .contador{font-weight:800;font-size:16px;background:#fff;border-radius:999px;padding:7px 11px;box-shadow:0 2px 8px #0002;flex:0 0 auto}
  .palco{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
  #card{display:block;max-width:100%;max-height:calc(100dvh - 112px);width:auto;height:auto;object-fit:contain;border-radius:14px;box-shadow:0 5px 20px #0003;background:white;user-select:none;-webkit-user-drag:none}
  .controles{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-top:10px}
  button{border:0;border-radius:13px;min-height:48px;padding:10px 14px;font-weight:800;font-size:20px;color:#fff;background:#07599b;box-shadow:0 3px 9px #0002;cursor:pointer}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.35;cursor:default}
  #prev{text-align:center}
  #next{text-align:center}
  #reset{background:#c62828;font-size:15px;padding-inline:16px}
  .hint{text-align:center;font-size:12px;opacity:.72;padding-top:6px}
  @media (min-width:700px){.app{padding:14px}.hint{font-size:13px}}
</style>
</head>
<body>
<main class="app" aria-label="Carrossel de questões">
  <header class="topo">
    <div class="titulo">Curso de Contabilidade Professor Moreira</div>
    <div class="contador" id="counter">1 / 38</div>
  </header>

  <section class="palco" id="stage">
    <img id="card" src="imagens/card-01.webp" alt="Questão 1 de 38" decoding="async" fetchpriority="high">
  </section>

  <nav class="controles" aria-label="Controles do carrossel">
    <button id="prev" type="button" aria-label="Imagem anterior">←</button>
    <button id="reset" type="button">Reiniciar</button>
    <button id="next" type="button" aria-label="Próxima imagem">→</button>
  </nav>
  <div class="hint">Deslize para os lados para avançar ou voltar</div>
</main>

<script>
(() => {
  const total = 38;
  let current = 1;
  const card = document.getElementById('card');
  const counter = document.getElementById('counter');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const reset = document.getElementById('reset');
  const stage = document.getElementById('stage');

  const src = n => `imagens/card-${String(n).padStart(2,'0')}.webp`;

  function preload(n){
    if(n < 1 || n > total) return;
    const im = new Image();
    im.src = src(n);
  }

  function show(n){
    current = Math.max(1, Math.min(total, n));
    card.src = src(current);
    card.alt = `Questão ${current} de ${total}`;
    counter.textContent = `${current} / ${total}`;
    prev.disabled = current === 1;
    next.disabled = current === total;
    preload(current + 1);
    preload(current - 1);
  }

  prev.addEventListener('click', () => show(current - 1));
  next.addEventListener('click', () => show(current + 1));
  reset.addEventListener('click', () => show(1));

  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft') show(current - 1);
    if(e.key === 'ArrowRight') show(current + 1);
    if(e.key === 'Home') show(1);
  });

  let startX = 0, startY = 0, active = false;
  stage.addEventListener('pointerdown', e => {
    active = true; startX = e.clientX; startY = e.clientY;
  });
  stage.addEventListener('pointerup', e => {
    if(!active) return;
    active = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2){
      dx < 0 ? show(current + 1) : show(current - 1);
    }
  });
  stage.addEventListener('pointercancel', () => active = false);

  show(1);
})();
</script>
</body>
</html>
